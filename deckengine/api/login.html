<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — DeckEngine</title>
<style>
  :root {
    --bg: #f4f2ec; --surface: #ffffff; --surface-2: #faf9f5;
    --ink: #23262b; --muted: #6f6a61;
    --line: #e4e1d8; --line-strong: #d3cfc4;
    --navy: #2c3a47; --slate: #51626f; --accent: #c05621;
    --shadow-lg: 0 18px 48px rgba(35,38,43,.16), 0 6px 16px rgba(35,38,43,.10);
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font: 15px/1.55 -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
    background: var(--bg); color: var(--ink); min-height: 100vh;
    display: grid; place-items: center; padding: 20px;
    -webkit-font-smoothing: antialiased;
  }
  .panel {
    width: 100%; max-width: 400px; background: var(--surface);
    border: 1px solid var(--line); border-radius: 16px;
    box-shadow: var(--shadow-lg); padding: 36px 32px;
  }
  .mark { font: 700 24px Georgia, serif; color: var(--navy); text-align: center; }
  .mark b { color: var(--accent); }
  .sub { text-align: center; color: var(--muted); font-size: 13.5px;
         margin: 6px 0 28px; }
  label { display: block; font-weight: 600; font-size: 13px; color: var(--navy);
          margin: 16px 0 6px; }
  input {
    width: 100%; border: 1px solid var(--line-strong); border-radius: 10px;
    padding: 12px 14px; font: 15px/1.4 inherit; background: var(--surface-2);
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus { outline: none; border-color: var(--slate);
                box-shadow: 0 0 0 3px rgba(81,98,111,.12); }
  button {
    width: 100%; margin-top: 24px; border: 0; border-radius: 10px;
    background: var(--navy); color: #fff; font: 600 15px/1 inherit;
    padding: 14px; cursor: pointer; transition: background .15s;
  }
  button:hover { background: #22303b; }
  button:disabled { opacity: .6; cursor: wait; }
  .err {
    display: none; margin-top: 14px; padding: 10px 12px; border-radius: 8px;
    background: #fbeaea; border: 1px solid #eac8c8; color: #8a2f2f;
    font-size: 13.5px;
  }
  .note { text-align: center; color: var(--muted); font-size: 12.5px;
          margin-top: 22px; }
</style>
</head>
<body>
  <form class="panel" id="f">
    <div class="mark">Deck<b>Engine</b></div>
    <div class="sub">Sign in to generate your presentation</div>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required
           placeholder="you@company.com">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required
           placeholder="••••••••">
    <button id="go" type="submit">Sign in</button>
    <div class="err" id="err"></div>
    <div class="note">Access is provisioned by SkyQuest. One deck per account.</div>
  </form>
<script>
  const f = document.getElementById("f"), err = document.getElementById("err"),
        go = document.getElementById("go");
  f.addEventListener("submit", async (e) => {
    e.preventDefault();
    err.style.display = "none";
    go.disabled = true; go.textContent = "Signing in…";
    try {
      const r = await fetch("/login", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({email: email.value.trim(), password: pw.value}),
      });
      if (r.ok) { location.href = "/"; return; }
      const d = await r.json().catch(() => ({}));
      err.textContent = d.detail || "Sign-in failed. Check your email and password.";
      err.style.display = "block";
    } catch {
      err.textContent = "Could not reach the server. Try again.";
      err.style.display = "block";
    }
    go.disabled = false; go.textContent = "Sign in";
  });
</script>
</body>
</html>
