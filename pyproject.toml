[project]
name = "deckengine"
version = "0.1.0"
description = "Consulting-grade PPTX generation engine: LLM writes a validated JSON spec, a deterministic layout engine renders editable decks."
requires-python = ">=3.11"
dependencies = [
    "python-pptx>=1.0",
    "pydantic>=2.7",
    "Pillow>=10",
    "lxml>=5",
    "uharfbuzz>=0.39",
    "fonttools>=4.50",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
corpus = ["pypdfium2>=4"]
# Linux/EC2 deploy: soffice preview path rasterizes PDF pages with pypdfium2;
# python-multipart backs the /assets upload endpoint; openai for the default
# provider (anthropic is a core dep already).
server = ["pypdfium2>=4", "python-multipart>=0.0.9", "openai>=1.40"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["deckengine*"]
